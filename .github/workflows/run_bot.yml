name: Autonomous Agency Lead Gen Bot

on:
  schedule:
    # Runs every 8 hours (3 times a day)
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      custom_niche:
        description: 'Specific Niche (e.g., dentists). Leave blank for random.'
        required: false
        type: string
      custom_city:
        description: 'Specific City (e.g., Mumbai, India). Leave blank for random.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          CUSTOM_NICHE: ${{ inputs.custom_niche }}
          CUSTOM_CITY: ${{ inputs.custom_city }}
        run: python bot.py

      - name: Commit Contacted List
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update leads and phone lists"
          file_pattern: contacted.txt phone_leads.txt no_website_leads.txt
