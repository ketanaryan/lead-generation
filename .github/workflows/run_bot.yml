name: Autonomous Agency Lead Gen Bot

on:
  schedule:
    # Runs every 3 hours to continuously work while protecting your Gmail limits
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python bot.py

      - name: Commit Contacted List
        # This saves the 'contacted.txt' file back to GitHub so it remembers who it emailed tomorrow
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update contacted leads list"
          file_pattern: contacted.txt
